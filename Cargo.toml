[package]
name = "tiwut-ai-v2"
version = "2.0.0"
edition = "2021"
description = "High-Performance Cross-Platform Neural Network AI Engine & API"
authors = ["Tiwut"]

[[bin]]
name = "tiwut-ai"
path = "src/main.rs"

[dependencies]
# Async runtime & Web API
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
futures-util = "0.3"
tokio-stream = "0.1"

# Serialization & Packaging
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "1.1", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }

# Parallel Compute & Math
rayon = "1.10"
rand = "0.8"

# Web Scraping & Ingestion
reqwest = { version = "0.12", features = ["json", "blocking"] }
scraper = "0.19"
regex = "1.10"

# CLI & Formatting
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
sysinfo = "0.30"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
